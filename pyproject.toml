[project]
name = "pandas-viz"
version = "0.1.0"
description = "Visualize pandas pipelines: see every step's shape, joins, nulls and dtype drift as a graph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
notebook = ["ipython>=8"]

[project.scripts]
pandas-viz = "pandas_viz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandas_viz"]

[dependency-groups]
dev = [
    "ipython>=8",
    "pandera>=0.33",
    "pytest>=8",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
